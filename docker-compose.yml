services:
  app:
    build:
      context: .
      args:
        # canonical 域名本地默认指向当前容器；品牌类变量默认留空，
        # 让 resolveSiteConfig() 回退到 web/src/config/site-config.ts。
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:1323}
        VITE_SITE_NAME: ${VITE_SITE_NAME:-}
        VITE_SITE_SHORT_NAME: ${VITE_SITE_SHORT_NAME:-}
        VITE_SITE_MARK: ${VITE_SITE_MARK:-}
        VITE_SITE_FAVICON: ${VITE_SITE_FAVICON:-}
        VITE_SITE_LOCALE: ${VITE_SITE_LOCALE:-}
        VITE_SITE_PRIMARY_KEYWORD: ${VITE_SITE_PRIMARY_KEYWORD:-}
        VITE_SITE_TITLE: ${VITE_SITE_TITLE:-}
        VITE_SITE_DESCRIPTION: ${VITE_SITE_DESCRIPTION:-}
        VITE_SITE_IMAGE: ${VITE_SITE_IMAGE:-}
        VITE_HOME_PRIMARY_TOOL_SLUG: ${VITE_HOME_PRIMARY_TOOL_SLUG:-}
        SEO_STRICT: ${SEO_STRICT:-false}
        # 下面两个只用于母模板 CI/测试，真实生产保持 false。
        SEO_ALLOW_TEMPLATE_EXAMPLES: ${SEO_ALLOW_TEMPLATE_EXAMPLES:-false}
        SEO_ALLOW_SVG_SOCIAL_IMAGE: ${SEO_ALLOW_SVG_SOCIAL_IMAGE:-false}
    ports:
      - "1323:1323"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 1323
      DB_DRIVER: sqlite
      DB_PATH: /app/data/app.db
    volumes:
      # 容器以非 root (uid 1000) 运行。Linux 主机上 compose 自动创建的目录属主是 root，
      # 首次启动前需要: mkdir -p data && sudo chown 1000:1000 data
      # (macOS/Windows 的 Docker Desktop 会自动处理权限，无需此步骤)
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:1323/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: fullstack_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
