services:
  app:
    build: .
    ports:
      - "1323:1323"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 1323
      DB_DRIVER: sqlite
      DB_PATH: /app/data/app.db
      SESSION_SECRET: replace-in-production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:1323/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: fullstack_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
