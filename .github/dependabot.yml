# 配置项完整说明见：
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 前端依赖
  # 使用 Bun 更新器，让依赖 PR 同时更新 package.json 和 bun.lock。
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      # Framework 的构建工具与运行时必须同版本升级。
      react-router:
        patterns: ["react-router", "@react-router/*"]
    ignore:
      # typescript-eslint 尚不支持 TypeScript 7.x
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Framework 大版本需要迁移配置，不能只升级构建工具。
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]

  # Go 依赖
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # 工作流中引用的 action 版本。
  # 缺少这一项时 .github/workflows 无人维护，build.yml 曾因此落后三个大版本。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # action 升级通常是纯版本号变动，合并成一个 PR 减少噪音
      actions:
        patterns: ["*"]

  # Dockerfile 里的基础镜像
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 这两个镜像随 web/package.json 的 packageManager 和 go.mod 同步升级；
      # Docker 更新器只改镜像 tag，会使 CI 的工具链一致性检查失败。
      - dependency-name: "oven/bun"
      - dependency-name: "golang"
