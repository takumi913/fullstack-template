name: Docker image build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 预发布（-rc/-alpha/-beta）只推版本号 tag，不推 latest，
          # 避免 :latest 被预发布版本覆盖。
          # 表达式为空字符串的行会被 build-push-action 忽略。
          tags: |
            ghcr.io/${{ github.repository_owner }}/fullstack-template:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && format('ghcr.io/{0}/fullstack-template:latest', github.repository_owner) || '' }}
