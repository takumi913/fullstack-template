name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支的新提交自动取消进行中的旧运行：
# PR 上连续 push 时不必等旧的跑完，省 runner 时间也更快拿到反馈
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Go 后端检查和测试
  go-lint-and-test:
    name: Go Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fullstack_template_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/fullstack_template_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 与 go.mod 的 go 指令保持一致；setup-go 自带模块与构建缓存
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 与 Makefile 的 GOLANGCI_LINT_VERSION 保持一致
          version: v2.12.2
          args: --timeout=5m

      # 直接复用 make 目标，避免 CI 与 Makefile 各自维护一份检查逻辑后漂移
      - name: Verify sqlc generated code
        run: make sqlc-verify

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Build Go binary
        # make build-go 使用 CGO_ENABLED=0，与 build.sh/Dockerfile 的发布形态一致
        run: make build-go

  # 前端检查和测试
  frontend-lint-and-test:
    name: Frontend Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SITE_URL: https://template-ci.fullstack.dev
      VITE_SITE_NAME: Template CI
      VITE_SITE_SHORT_NAME: Template CI
      VITE_SITE_MARK: T
      VITE_SITE_LOCALE: en
      VITE_SITE_PRIMARY_KEYWORD: template ci tools
      VITE_SITE_TITLE: Template CI SEO Verification
      VITE_SITE_DESCRIPTION: CI build used to verify production SEO output and template safeguards.
      VITE_SITE_IMAGE: /og-image.svg
      SEO_STRICT: "true"
      # CI intentionally keeps the template demo pages so their SSG/SEO behavior remains covered.
      SEO_ALLOW_TEMPLATE_EXAMPLES: "true"
      # Template CI also exercises the generated SVG fallback; real production should use PNG/JPEG.
      SEO_ALLOW_SVG_SOCIAL_IMAGE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 前端全程使用 bun 运行，不需要单独安装 Node
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 版本唯一来源是 web/package.json 的 packageManager 字段。
          # 不要在这里写死版本号：dependabot 改不了 workflow 输入，
          # 曾出现这里 pin 1.3.2 而 Dockerfile 已被升到 1.3.14 的漂移
          bun-version-file: web/package.json

      # 只缓存下载内容，不缓存 node_modules：
      # 后者可能来自不同的锁文件，与 --frozen-lockfile 的意图相悖
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Verify build toolchain alignment
        run: |
          PACKAGE_BUN="$(bun -e 'console.log(require("./web/package.json").packageManager.split("@")[1])')"
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod)"
          grep -Fq "oven/bun:${PACKAGE_BUN}-alpine" Dockerfile
          grep -Fq "golang:${GO_VERSION}-alpine" Dockerfile

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: web
        run: |
          if ! bun run format:check; then
            bun run format
            git diff -- .
            exit 1
          fi

      - name: Run frontend lint
        working-directory: web
        run: bun run lint

      - name: Run frontend typecheck
        working-directory: web
        run: bun run typecheck

      - name: Run frontend tests
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        run: bun run build

      # 第二种母模板首页形态：第一屏直接运行核心工具。
      # 这一步会再次执行 seo:verify，确保首页 hydration、工具首屏和 bundle 隔离都成立。
      - name: Build interactive homepage variant
        working-directory: web
        env:
          VITE_HOME_PRIMARY_TOOL_SLUG: json-formatter
        run: bun run build


  # 真正构建并启动最终生产镜像，防止 Dockerfile、前端 SSG 与 Go 静态服务各自通过，
  # 但组合到镜像后出现 build-arg、复制路径或 HTTP 行为漂移。
  docker-smoke:
    name: Production Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - go-lint-and-test
      - frontend-lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: |
          docker build \
            --build-arg VITE_SITE_URL=https://docker-ci.fullstack.dev \
            --build-arg VITE_SITE_NAME="Docker CI" \
            --build-arg VITE_SITE_SHORT_NAME="Docker CI" \
            --build-arg VITE_SITE_MARK=D \
            --build-arg VITE_SITE_LOCALE=en \
            --build-arg VITE_SITE_PRIMARY_KEYWORD="docker ci tools" \
            --build-arg VITE_SITE_TITLE="Docker CI SEO Verification" \
            --build-arg VITE_SITE_DESCRIPTION="Production container smoke test for the fullstack tool-site template." \
            --build-arg VITE_SITE_IMAGE=/og-image.svg \
            --build-arg SEO_STRICT=true \
            --build-arg SEO_ALLOW_TEMPLATE_EXAMPLES=true \
            --build-arg SEO_ALLOW_SVG_SOCIAL_IMAGE=true \
            -t fullstack-template:ci .

      - name: Start production container
        run: |
          docker run -d --rm \
            --name fullstack-template-ci \
            -p 1323:1323 \
            fullstack-template:ci

      - name: Wait for application
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1323/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs fullstack-template-ci
          exit 1

      - name: Verify production HTTP behavior
        run: |
          test "$(curl --silent --output /tmp/home.html --write-out '%{http_code}' http://127.0.0.1:1323/)" = "200"
          grep -Fq "Docker CI SEO Verification" /tmp/home.html

          test "$(curl --silent --output /tmp/tool.html --write-out '%{http_code}' http://127.0.0.1:1323/tools/json-formatter)" = "200"
          grep -Fq "JSON Formatter" /tmp/tool.html

          test "$(curl --silent --output /tmp/missing.html --write-out '%{http_code}' http://127.0.0.1:1323/definitely-missing)" = "404"

          curl --silent --dump-header /tmp/dashboard.headers --output /tmp/dashboard.html http://127.0.0.1:1323/dashboard
          grep -Eiq '^X-Robots-Tag: noindex, nofollow' /tmp/dashboard.headers

          curl --fail --silent http://127.0.0.1:1323/robots.txt > /tmp/robots.txt
          grep -Fq "Sitemap: https://docker-ci.fullstack.dev/sitemap.xml" /tmp/robots.txt

          curl --fail --silent http://127.0.0.1:1323/sitemap.xml > /tmp/sitemap.xml
          grep -Fq "<loc>https://docker-ci.fullstack.dev/</loc>" /tmp/sitemap.xml

      - name: Show container logs on failure
        if: failure()
        run: docker logs fullstack-template-ci || true

      - name: Stop production container
        if: always()
        run: docker stop fullstack-template-ci || true
