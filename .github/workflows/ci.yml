name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Go 后端检查和测试
  go-lint-and-test:
    name: Go Lint and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fullstack_template_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/fullstack_template_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 与 go.mod 的 go 指令保持一致；setup-go 自带模块与构建缓存
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Verify sqlc generated code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          # 用 git status 而非 git diff：新生成但未提交的文件是未跟踪状态，git diff 看不见
          if [ -n "$(git status --porcelain -- db/generated)" ]; then
            echo "::error::db/generated 与 db/query 不一致，请提交 sqlc 生成结果"
            git status --porcelain -- db/generated
            git diff -- db/generated
            exit 1
          fi

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Build Go binary
        run: go build -o server main.go

  # 前端检查和测试
  frontend-lint-and-test:
    name: Frontend Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 前端全程使用 bun 运行，不需要单独安装 Node
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      # 只缓存下载内容，不缓存 node_modules：
      # 后者可能来自不同的锁文件，与 --frozen-lockfile 的意图相悖
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: web
        run: bun run format:check

      - name: Run frontend lint
        working-directory: web
        run: bun run lint

      - name: Run frontend tests
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        run: bun run build

  # 校验镜像可构建。发布时才推送镜像，这里只构建，
  # 否则 Dockerfile 的问题要等到发布当天才会暴露。
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
