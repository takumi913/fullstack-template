name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支的新提交自动取消进行中的旧运行：
# PR 上连续 push 时不必等旧的跑完，省 runner 时间也更快拿到反馈
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go 后端检查和测试
  go-lint-and-test:
    name: Go Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fullstack_template_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/fullstack_template_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 与 go.mod 的 go 指令保持一致；setup-go 自带模块与构建缓存
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 与 Makefile 的 GOLANGCI_LINT_VERSION 保持一致
          version: v2.12.2
          args: --timeout=5m

      # 直接复用 make 目标，避免 CI 与 Makefile 各自维护一份检查逻辑后漂移
      - name: Verify sqlc generated code
        run: make sqlc-verify

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Build Go binary
        # make build-go 使用 CGO_ENABLED=0，与 build.sh/Dockerfile 的发布形态一致
        run: make build-go

  # 前端检查和测试
  frontend-lint-and-test:
    name: Frontend Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 前端全程使用 bun 运行，不需要单独安装 Node
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 版本唯一来源是 web/package.json 的 packageManager 字段。
          # 不要在这里写死版本号：dependabot 改不了 workflow 输入，
          # 曾出现这里 pin 1.3.2 而 Dockerfile 已被升到 1.3.14 的漂移
          bun-version-file: web/package.json

      # 只缓存下载内容，不缓存 node_modules：
      # 后者可能来自不同的锁文件，与 --frozen-lockfile 的意图相悖
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: web
        run: bun run format:check

      - name: Run frontend lint
        working-directory: web
        run: bun run lint

      - name: Run frontend tests
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        run: bun run build

  # 校验镜像可构建。发布时才推送镜像，这里只构建，
  # 否则 Dockerfile 的问题要等到发布当天才会暴露。
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Dockerfile 的构建阶段固定在宿主架构上交叉编译（--platform=$BUILDPLATFORM），
      # 只有最终镜像里少量 RUN 需要 QEMU，因此两个架构一起验证的开销很小。
      # 不在这里验证 arm64 的话，Dockerfile 的 arm64 问题要到发布当天才暴露。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
